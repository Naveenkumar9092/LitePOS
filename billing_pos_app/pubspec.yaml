name: billing_pos_app
description: "Offline-first and Online Billing POS System for Cafe, Food Court, Ice Cream & Desserts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Network & API Communication
  dio: ^5.8.0+1

  # Persistence & Offline Storage
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Utilities & Formatting
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3

  # UI & Design System
  google_fonts: ^6.2.1
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

